:root{
  --ocean:#9fcbe2; --land:#f4ecd8; --coast:#d6c49b;
  --ink:#0d2235; --muted:#5b6b7a; --line:#e3e8ee; --bg:#ffffff;
  --brand:#0a5d8f; --accent:#ff6b4a; --sheet-h:42vh;
  --B:#1f9d55; --I:#2b6cb0; --A:#dd6b20; --E:#c53030;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--ocean);-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;background:var(--ocean)}
.leaflet-container{background:var(--ocean);font-family:inherit}
header{position:fixed;top:0;left:0;right:0;z-index:1000;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));background:linear-gradient(180deg,rgba(13,34,53,.92),rgba(13,34,53,.78));color:#fff;backdrop-filter:blur(6px)}
header h1{margin:0;font-size:18px;letter-spacing:.2px;font-weight:800}
header h1 span{color:#ffb39f}
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn{flex:none;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;display:none}
.fbtn.act{background:var(--accent);border-color:var(--accent)}
#filters{display:block}
@media (max-width:799px){
  .fbtn{display:block}
  #filters{display:none}
  header.open #filters{display:block}
  header h1{font-size:17px}
  .chip{padding:7px 12px;font-size:13.5px}
  .fc{padding:7px 10px;font-size:13px}
  .leaflet-control-zoom{display:none}
  .grab{padding:10px 0 8px;touch-action:none}
  .grab i{width:44px}
  .row{padding:12px 0}
  .scroll{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  #panel.drag{transition:none}
}
.cl{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;cursor:pointer}
.frow{display:flex;align-items:center;gap:6px;margin-top:7px;overflow-x:auto;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.flab{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.7);flex:none;width:44px}
.fc{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:4px 9px;font-size:12.5px;white-space:nowrap;cursor:pointer;flex:none}
.fc.on{background:#fff;color:var(--ink);font-weight:650;border-color:#fff}
.fc.lvB.on{background:var(--B);border-color:var(--B);color:#fff}.fc.lvI.on{background:var(--I);border-color:var(--I);color:#fff}
.fc.lvA.on{background:var(--A);border-color:var(--A);color:#fff}.fc.lvE.on{background:var(--E);border-color:var(--E);color:#fff}
.brk.off{opacity:.35}
.clear{border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.chip.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:600}
#panel{position:fixed;z-index:1001;background:var(--bg);box-shadow:0 -6px 24px rgba(13,34,53,.18);display:flex;flex-direction:column}
@media (max-width:799px){
  #panel{left:0;right:0;bottom:0;height:var(--sheet-h);border-radius:16px 16px 0 0;transition:height .25s ease}
  #panel.tall{height:82vh}
  #panel.mini{height:118px}
}
@media (min-width:800px){
  #panel{top:var(--hh,96px);right:14px;bottom:14px;width:390px;border-radius:14px}
}
.grab{padding:8px 0 2px;display:flex;justify-content:center;cursor:pointer;flex:none}
@media (min-width:800px){ .grab{display:none} .scroll{padding-top:12px} }
.grab i{width:40px;height:5px;border-radius:3px;background:#cfd6de}
.scroll{overflow-y:auto;padding:4px 16px 24px;flex:1;-webkit-overflow-scrolling:touch}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 0 6px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.num.done{background:var(--B)}
.row .t{flex:1;min-width:0}
.row .n{font-weight:650;font-size:15px}
.row .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.lv{display:inline-flex;gap:3px;flex:none}
.pill{font-size:10.5px;font-weight:700;color:#fff;border-radius:5px;padding:2px 6px;line-height:1.4}
.pill.B{background:var(--B)}.pill.I{background:var(--I)}.pill.A{background:var(--A)}.pill.E{background:var(--E)}
.back{border:0;background:none;color:var(--brand);font-size:14px;padding:6px 0;cursor:pointer;font-weight:600}
h2{margin:2px 0 2px;font-size:24px;font-weight:800}
.sub{color:var(--muted);font-size:13.5px}
.stats{display:flex;gap:8px;margin:12px 0 4px}
.stat{flex:1;background:#f3f6f9;border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:16px}
.stat small{color:var(--muted);font-size:11.5px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 0 6px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14.5px}
.steps .ic{flex:none;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.ic.fly{background:#e6f0fa}.ic.car{background:#f1efe7}.ic.boat{background:#e3f7f4}
.steps .w{color:var(--muted);font-size:12.5px}
p{font-size:14.5px;line-height:1.5;margin:6px 0}
.brk{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.brk:last-child{border-bottom:0}
.brk .t{flex:1}
.brk .n{font-weight:600;font-size:14.5px}
.brk .s{font-size:12.5px;color:var(--muted)}
.crowd{letter-spacing:-1px;white-space:nowrap;font-size:13px}.crowd i{font-style:normal;opacity:.18;filter:grayscale(1)}
.stat .crowd{font-size:14px}
.ckey{font-size:12px;color:var(--muted);margin-top:6px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.done-btn{margin-top:12px;width:100%;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:10px;font-size:14.5px;font-weight:650;cursor:pointer}
.done-btn.on{background:var(--B);border-color:var(--B);color:#fff}
.done-btn[disabled]{opacity:.5;cursor:default}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#eef2f6}
.photos img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.photos .x{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;cursor:pointer}
.photos .x.sure{width:auto;border-radius:12px;padding:0 8px;background:var(--E)}
.add{aspect-ratio:1;border:1.5px dashed #b8c3ce;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;cursor:pointer;background:#fafbfc}
.add b{font-size:22px;line-height:1}
.empty{font-size:13px;color:var(--muted);background:#f3f6f9;border-radius:10px;padding:10px 12px}
.banner{font-size:13px;line-height:1.45;border-radius:10px;padding:9px 11px;margin-top:10px}
.banner.hid{background:#eef7f4;color:#14532d}
.banner.spec{background:#fff6e0;color:#7a4b00}
.note{font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.45}
.mk{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:transform .15s}
.mk.done{background:var(--B)}
.mk.sel{background:var(--accent);transform:scale(1.25)}
.home{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.lbl{background:rgba(255,255,255,.92);border:0;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2);font-weight:650;font-size:12px;padding:2px 7px;color:var(--ink)}
.lbl:before{display:none}
.hop{background:rgba(13,34,53,.85);color:#fff;border:0;border-radius:6px;font-size:11px;padding:2px 6px;box-shadow:none}
.hop:before{display:none}
#viewer{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
#viewer.on{display:flex}
#viewer img{max-width:94vw;max-height:88vh;border-radius:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:4000;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = { fly: '✈️', car: '🚗', boat: '🚤' };
const GROUPS = ['Indonesia', 'Pacific', 'Australia', 'New Zealand', 'Asia & Indian Ocean'];
SPOTS.sort((a, b) => GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group));
SPOTS.forEach((s, i) => s.n = i + 1);

function km(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}
const fmtKm = k => k.toLocaleString('en-AU') + ' km';
function levels(str) { return [...str].map(c => `<span class="pill ${c}">${LV[c]}</span>`).join(''); }
function spotLevels(s) {
  const set = new Set(s.breaks.flatMap(b => [...b[2]]));
  return ['B', 'I', 'A', 'E'].filter(c => set.has(c)).map(c => `<span class="pill ${c}">${c}</span>`).join('');
}
function stars(n) { return `<span class="crowd" title="Crowd ${n}/5">${'🧍'.repeat(n)}<i>${'🧍'.repeat(5 - n)}</i></span>`; }
const CROWD_KEY = 'Crowd: 0 = empty, 5 = Snapper Rocks';
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600); }

// ---------- shared state (photos + surfed ticks) ----------
const state = { photos: {}, done: {}, canWrite: false, canUpload: false, db: null, assets: null };

// ---------- map ----------
const map = L.map('map', { zoomControl: false, attributionControl: true, worldCopyJump: false, minZoom: 1, maxZoom: 11, zoomSnap: 0.25 });
map.attributionControl.setPrefix(false).addAttribution('Coastlines: Natural Earth');
L.control.zoom({ position: 'topleft' }).addTo(map);
const ALL_BOUNDS = L.latLngBounds(SPOTS.map(s => s.ll).concat([SYD]));
map.fitBounds(ALL_BOUNDS);

fetch('land.json').then(r => r.json()).then(geo => {
  L.geoJSON(geo, { interactive: false, style: { color: '#d6c49b', weight: 0.8, fillColor: '#f4ecd8', fillOpacity: 1 } }).addTo(map).bringToBack();
}).catch(() => {});

L.marker(SYD, { icon: L.divIcon({ className: '', html: '<div class="home">🏠</div>', iconSize: [30, 30], iconAnchor: [15, 15] }), zIndexOffset: 500 })
  .addTo(map).bindTooltip('Sydney (home)', { direction: 'top', offset: [0, -14], className: 'lbl' });

const markers = {};
function markerIcon(s, sel) {
  const cls = 'mk' + (state.done[s.id] ? ' done' : '') + (sel ? ' sel' : '');
  return L.divIcon({ className: '', html: `<div class="${cls}">${s.n}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] });
}
SPOTS.forEach(s => {
  const m = L.marker(s.ll, { icon: markerIcon(s, false), zIndexOffset: 1000 }).addTo(map);
  m.bindTooltip(s.name, { direction: 'right', offset: [14, 0], className: 'lbl', permanent: false });
  m.on('click', () => go(s.id));
  markers[s.id] = m;
});

// group pins that overlap on screen into a tappable bubble
const clusterLayer = L.layerGroup().addTo(map);
function recluster() {
  if (!map._loaded) return;
  clusterLayer.clearLayers();
  const vis = SPOTS.filter(visible);
  const pts = vis.map(s => ({ s, p: map.latLngToLayerPoint(s.ll) }));
  const used = new Set(), R = window.innerWidth < 800 ? 30 : 24;
  pts.forEach((a, i) => {
    if (used.has(i)) return;
    const grp = [a];
    pts.forEach((b, j) => { if (j > i && !used.has(j) && a.p.distanceTo(b.p) < R) { grp.push(b); used.add(j); } });
    used.add(i);
    const isSel = grp.some(g => current && g.s.id === current.id);
    if (grp.length === 1 || isSel) { grp.forEach(g => markers[g.s.id].addTo(map)); return; }
    grp.forEach(g => markers[g.s.id].remove());
    const b = L.latLngBounds(grp.map(g => g.s.ll));
    const m = L.marker(b.getCenter(), { icon: L.divIcon({ className: '', html: `<div class="cl">${grp.length}</div>`, iconSize: [34, 34], iconAnchor: [17, 17] }), zIndexOffset: 1200 });
    m.bindTooltip(grp.map(g => g.s.name).join(', '), { direction: 'top', offset: [0, -16], className: 'lbl' });
    m.on('click', () => {
      const z = Math.min(map.getBoundsZoom(b.pad(0.6), false, L.point(80, 80)), 10);
      map.flyTo(b.getCenter(), Math.max(z, map.getZoom() + 2), { duration: 0.6 });
    });
    m.addTo(clusterLayer);
  });
}
map.on('zoomend', recluster); map.on('load', recluster);

// route drawing
const routeLayer = L.layerGroup().addTo(map);
function arc(a, b) {
  const pts = [], [y1, x1] = a, [y2, x2] = b;
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy);
  const off = Math.min(d * 0.18, 8);
  const cx = (x1 + x2) / 2 - dy / d * off * -1, cy = (y1 + y2) / 2 + dx / d * off * -1;
  for (let t = 0; t <= 1.0001; t += 0.04) {
    const x = (1 - t) ** 2 * x1 + 2 * (1 - t) * t * cx + t * t * x2;
    const y = (1 - t) ** 2 * y1 + 2 * (1 - t) * t * cy + t * t * y2;
    pts.push([y, x]);
  }
  return pts;
}
function drawRoute(s) {
  routeLayer.clearLayers();
  let from = SYD;
  const all = [SYD];
  s.route.forEach((leg, i) => {
    const to = leg.ll;
    if (km(from, to) > 0.5) {
      let line;
      if (leg.mode === 'fly') line = L.polyline(arc(from, to), { color: '#0d2235', weight: 2.5, dashArray: '7 7', opacity: .9 });
      else if (leg.mode === 'boat') line = L.polyline([from, to], { color: '#00a3a3', weight: 4, dashArray: '2 7', lineCap: 'round' });
      else line = L.polyline([from, to], { color: '#ff6b4a', weight: 4, opacity: .95 });
      line.addTo(routeLayer);
    }
    if (i < s.route.length - 1 && leg.mode === 'fly') {
      L.circleMarker(to, { radius: 5, color: '#fff', weight: 2, fillColor: '#0d2235', fillOpacity: 1 })
        .bindTooltip(leg.to, { permanent: true, direction: 'top', offset: [0, -6], className: 'hop' }).addTo(routeLayer);
    }
    all.push(to); from = to;
  });
  return L.latLngBounds(all);
}

// ---------- panel ----------
const panel = $('#panel'), content = $('#content');
let filter = 'All', current = null;
let maxCrowd = 5; const lvSel = new Set();
const filtersOn = () => maxCrowd < 5 || lvSel.size > 0;
function breakMatch(b) { return b[3] <= maxCrowd && (lvSel.size === 0 || [...b[2]].some(c => lvSel.has(c))); }
function renderFilters() {
  $('#crowdRow').innerHTML = '<span class="flab">Crowd</span>' + [1, 2, 3, 4, 5].map(n =>
    `<button class="fc ${maxCrowd === n ? 'on' : ''}" data-c="${n}">${n === 5 ? 'Any' : '🧍'.repeat(n) + ' or less'}</button>`).join('');
  $('#lvRow').innerHTML = '<span class="flab">Level</span>' + ['B', 'I', 'A', 'E'].map(c =>
    `<button class="fc lv${c} ${lvSel.has(c) ? 'on' : ''}" data-l="${c}">${LV[c]}</button>`).join('');
  const n = (maxCrowd < 5 ? 1 : 0) + lvSel.size;
  const fb = $('#fbtn'); fb.textContent = n ? `Filters · ${n}` : 'Filters'; fb.classList.toggle('act', n > 0);
  document.documentElement.style.setProperty('--hh', ($('header').offsetHeight + 10) + 'px');
}
function filtersChanged() {
  renderFilters();
  if (current && !visible(current)) { location.hash = ''; return; }
  if (current) renderSpot(current); else renderList();
  fitFilter(!!current);
}
$('#fbtn').addEventListener('click', () => { $('header').classList.toggle('open'); renderFilters(); });
$('#crowdRow').addEventListener('click', e => { const b = e.target.closest('.fc'); if (!b) return; maxCrowd = +b.dataset.c; filtersChanged(); });
$('#lvRow').addEventListener('click', e => { const b = e.target.closest('.fc'); if (!b) return; const c = b.dataset.l; lvSel.has(c) ? lvSel.delete(c) : lvSel.add(c); filtersChanged(); });

function renderChips() {
  $('#chips').innerHTML = ['All', 'Hidden', ...GROUPS].map(g => `<button class="chip ${g === filter ? 'on' : ''}" data-g="${g}">${g === 'Hidden' ? '🤫 Hidden gems' : g}</button>`).join('');
}
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.g; renderChips();
  if (current) location.hash = ''; else renderList();
  fitFilter();
});
function visible(s) { return (filter === 'All' || s.group === filter || (filter === 'Hidden' && s.hidden)) && s.breaks.some(breakMatch); }
function fitFilter(noMove) {
  SPOTS.forEach(s => { const m = markers[s.id]; if (visible(s)) m.addTo(map); else m.remove(); });
  recluster();
  if (noMove) return;
  setTimeout(recluster, 0);
  if (filter === 'All' && !filtersOn()) { map.fitBounds(ALL_BOUNDS, padOpts()); return; }
  const pts = SPOTS.filter(visible).map(s => s.ll); pts.push(SYD);
  map.fitBounds(L.latLngBounds(pts), padOpts());
}
function padOpts() {
  const wide = window.innerWidth >= 800;
  const top = $('header').offsetHeight + 12;
  return wide ? { paddingTopLeft: [30, top], paddingBottomRight: [420, 30] }
              : { paddingTopLeft: [24, top], paddingBottomRight: [24, Math.round(window.innerHeight * (panel.classList.contains('tall') ? .72 : .42)) + 10] };
}

function renderList() {
  current = null;
  Object.values(markers).forEach((m, i) => m.setIcon(markerIcon(SPOTS[i], false)));
  routeLayer.clearLayers();
  const groups = GROUPS.filter(g => filter === 'All' || filter === 'Hidden' || g === filter);
  const doneCount = SPOTS.filter(s => state.done[s.id]).length;
  const shown = SPOTS.filter(visible);
  content.innerHTML = `
    <div class="sub" style="margin-top:6px">${filtersOn() || filter !== 'All' ? `${shown.length} of ${SPOTS.length} spots match · <button class="clear">Clear filters</button>` : `${SPOTS.length} spots · ${doneCount} surfed · tap one for the route`}</div>
    ${shown.length ? '' : '<p class="empty" style="margin-top:12px">No spots match. Try more crowd or another level.</p>'}
    ${groups.filter(g => shown.some(s => s.group === g)).map(g => `
      <div class="grp">${g}</div>
      ${shown.filter(s => s.group === g).map(s => `
        <div class="row" data-id="${s.id}">
          <div class="num ${state.done[s.id] ? 'done' : ''}">${state.done[s.id] ? '✓' : s.n}</div>
          <div class="t"><div class="n">${esc(s.name)}${s.hidden ? ' <span title="Hidden gem">🤫</span>' : ''}</div><div class="s">${esc(s.total)} · ${fmtKm(km(SYD, s.ll))}</div><div class="s">${stars(s.crowd)}${filtersOn() ? ` · ${s.breaks.filter(breakMatch).length} break${s.breaks.filter(breakMatch).length > 1 ? 's' : ''} match` : ''}</div></div>
          <div class="lv">${spotLevels(s)}</div>
        </div>`).join('')}
    `).join('')}
    <div class="legend" style="margin-top:16px">${levels('BIAE')}</div><div class="ckey">${stars(5)} ${CROWD_KEY}</div>
    <div class="note">Travel times are rough one-way estimates from Sydney and change with airline schedules. Check flights before booking. Distances are straight-line from Sydney.</div>`;
  content.scrollTop = 0;
}
content.addEventListener('click', e => {
  const r = e.target.closest('.row'); if (r) { go(r.dataset.id); return; }
  if (e.target.closest('.back')) { location.hash = ''; return; }
  if (e.target.closest('.clear')) { maxCrowd = 5; lvSel.clear(); filter = 'All'; renderChips(); filtersChanged(); return; }
  if (e.target.closest('.done-btn')) { toggleDone(); return; }
  if (e.target.closest('.add')) { $('#file').click(); return; }
  const x = e.target.closest('.x');
  if (x) {
    if (!x.classList.contains('sure')) { x.classList.add('sure'); x.textContent = 'Delete?'; setTimeout(() => { if (x.isConnected) { x.classList.remove('sure'); x.textContent = '✕'; } }, 3000); }
    else deletePhoto(x.dataset.doc, x.dataset.asset);
    return;
  }
  const img = e.target.closest('.photos img');
  if (img) { $('#viewer img').src = img.src; $('#viewer').classList.add('on'); }
});
$('#viewer').addEventListener('click', () => $('#viewer').classList.remove('on'));

function renderSpot(s) {
  const dist = km(SYD, s.ll);
  const photos = state.photos[s.id] || [];
  const done = !!state.done[s.id];
  content.innerHTML = `
    <button class="back">← All spots</button>
    <h2>${esc(s.name)}</h2>
    <div class="sub">${esc(s.area)} · ${s.group}</div>
    ${s.spec ? `<div class="banner spec">⚠️ <b>Frontier, low info.</b> Few public reports. Break details and transfers are best guesses, so check with a charter operator or local guide first.</div>`
      : s.hidden ? `<div class="banner hid">🤫 <b>Hidden gem.</b> Known to a small crowd and well off the usual Indo or Pacific path.</div>` : ''}
    <div class="stats">
      <div class="stat"><b>${fmtKm(dist)}</b><small>from Sydney</small></div>
      <div class="stat"><b>${esc(s.total)}</b><small>door to waves</small></div>
      <div class="stat"><b>${stars(s.crowd)}</b><small>crowd</small></div>
    </div>
    <h3>Getting there</h3>
    <ul class="steps">
      ${s.route.map(l => `<li><span class="ic ${l.mode}">${ICON[l.mode]}</span><div>${esc(l.to)}<div class="w">${esc(l.time)}</div></div></li>`).join('')}
    </ul>
    <h3>Overview</h3>
    <p>${esc(s.overview)}</p>
    <p><b>Season:</b> ${esc(s.season)}</p>
    <h3>Breaks</h3>
    ${(filtersOn() ? [...s.breaks].sort((a, b) => breakMatch(b) - breakMatch(a)) : s.breaks).map(b => `<div class="brk ${filtersOn() && !breakMatch(b) ? 'off' : ''}"><div class="t"><div class="n">${esc(b[0])}</div><div class="s">${esc(b[1])}</div><div class="s">${stars(b[3])}</div></div><div class="lv">${[...b[2]].map(c => `<span class="pill ${c}">${c}</span>`).join('')}</div></div>`).join('')}
    <div class="legend" style="margin-top:8px">${levels('BIAE')}</div><div class="ckey">${CROWD_KEY}. My estimates for a good swell in season.</div>
    ${photos.length || state.canUpload ? `<h3>Photos</h3>` : ''}
    ${photos.length || state.canUpload ? `<div class="photos">
      ${photos.map(p => `<div class="ph"><img src="${esc(p.url)}" alt="${esc(s.name)}" loading="lazy">${state.canUpload ? `<button class="x" data-doc="${esc(p.doc)}" data-asset="${esc(p.asset)}">✕</button>` : ''}</div>`).join('')}
      ${state.canUpload ? `<div class="add"><b>+</b>Add photo</div>` : ''}
    </div>` : ''}
    ${state.db ? `<button class="done-btn ${done ? 'on' : ''}" ${state.canWrite ? '' : 'disabled'}>${done ? '✓ Surfed it' : 'Mark as surfed'}</button>` : ''}
  `;
  content.scrollTop = 0;
}

function go(id) { if (location.hash !== '#' + id) location.hash = id; else route(); }
function route() {
  const id = location.hash.slice(1);
  const s = SPOTS.find(x => x.id === id);
  if (!s) { renderList(); fitFilter(); return; }
  if (!visible(s)) { filter = 'All'; renderChips(); if (!visible(s)) { maxCrowd = 5; lvSel.clear(); renderFilters(); } fitFilter(true); }
  current = s;
  SPOTS.forEach(x => markers[x.id].setIcon(markerIcon(x, x.id === s.id)));
  recluster();
  const b = drawRoute(s);
  if (window.innerWidth < 800 && panel.classList.contains('mini')) setSheet('mid');
  renderSpot(s);
  map.fitBounds(b, { ...padOpts(), maxZoom: 9 });
}
window.addEventListener('hashchange', route);

// mobile sheet: tap the handle to cycle sizes
function setSheet(state) {
  panel.classList.remove('mini', 'tall');
  if (state !== 'mid') panel.classList.add(state);
  panel.style.height = '';
}
$('#grab').addEventListener('click', () => {
  if (panel.classList.contains('mini')) setSheet('mid');
  else if (panel.classList.contains('tall')) setSheet('mini');
  else setSheet('tall');
});
(() => {
  let y0 = null, h0 = 0, moved = false;
  const grab = $('#grab');
  grab.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; h0 = panel.getBoundingClientRect().height; moved = false; panel.classList.add('drag'); }, { passive: true });
  grab.addEventListener('touchmove', e => {
    if (y0 === null) return;
    const dy = e.touches[0].clientY - y0; if (Math.abs(dy) > 4) moved = true;
    const h = Math.max(100, Math.min(window.innerHeight * 0.9, h0 - dy));
    panel.style.height = h + 'px';
  }, { passive: true });
  grab.addEventListener('touchend', e => {
    panel.classList.remove('drag');
    if (y0 === null) return;
    if (!moved) { y0 = null; panel.style.height = ''; return; }
    e.preventDefault();
    const h = panel.getBoundingClientRect().height / window.innerHeight; y0 = null;
    setSheet(h < 0.28 ? 'mini' : h > 0.6 ? 'tall' : 'mid');
  });
})();
// tapping the map shrinks the sheet so you can see more of it
map.on('click', () => { if (window.innerWidth < 800 && !panel.classList.contains('mini')) setSheet('mini'); });

// ---------- shared data: photos + surfed ticks ----------
function refresh() {
  if (current) { renderSpot(current); SPOTS.forEach(x => markers[x.id].setIcon(markerIcon(x, x.id === current.id))); }
  else renderList();
}
async function toggleDone() {
  if (!state.db || !current) return;
  const s = current, v = !state.done[s.id];
  state.done[s.id] = v; refresh();
  try { await state.db.doc('surfed/' + s.id).set({ done: v, at: Date.now() }); }
  catch (e) { state.done[s.id] = !v; refresh(); toast("Couldn't save that. You may only have view access."); }
}
$('#file').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length || !current || !state.assets) return;
  const s = current;
  toast(`Uploading ${files.length} photo${files.length > 1 ? 's' : ''}…`);
  for (const f of files) {
    try {
      const blob = await shrink(f);
      const a = await state.assets.upload(blob);
      await state.db.collection('photos').add({ spot: s.id, asset: a.id, at: Date.now() });
    } catch (err) { toast("A photo didn't upload. Try a smaller image."); }
  }
});
async function deletePhoto(docId, assetId) {
  try {
    await state.db.doc('photos/' + docId).delete();
    try { await state.assets.delete(assetId); } catch (_) {}
  } catch (e) { toast("Couldn't delete that photo."); }
}
// resize big phone photos before upload
function shrink(file) {
  return new Promise(res => {
    if (!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)) return res(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1800, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b || file), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

fetch('photos.json').then(r => r.ok ? r.json() : {}).then(m => {
  if (state.db || !m) return;
  Object.entries(m).forEach(([id, list]) => { state.photos[id] = (list || []).map(u => ({ url: u, doc: '', asset: '' })); });
  refresh();
}).catch(() => {});

(async () => {
  if (!window.claude || !claude.use) return;
  try {
    const [db, user, assets] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets')]);
    if (!db) return;
    state.db = db; state.assets = assets;
    let w = null;
    try { w = user && user.can ? await user.can('data.write') : null; } catch (_) {}
    state.canWrite = w !== false;
    state.canUpload = !!assets && state.canWrite;
    db.collection('surfed').onSnapshot(snap => {
      state.done = {};
      snap.docs.forEach(d => { const v = d.data(); if (v && v.done) state.done[d.id] = true; });
      refresh();
    }, () => {});
    db.collection('photos').orderBy('at').onSnapshot(snap => {
      state.photos = {};
      snap.docs.forEach(d => {
        const v = d.data(); if (!v || !v.spot || !v.asset) return;
        (state.photos[v.spot] = state.photos[v.spot] || []).push({ doc: d.id, asset: v.asset, url: '/_blob/' + v.asset });
      });
      refresh();
    }, () => {});
    refresh();
  } catch (_) {}
})();

// ---------- start ----------
renderChips();
renderFilters();
window.addEventListener('resize', renderFilters);
map.fitBounds(ALL_BOUNDS, padOpts());
route();
</script>
</body>
</html>
